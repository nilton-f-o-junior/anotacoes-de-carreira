<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Date Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>JS Date Explorer</h1>
            <p>Explore a manipulação de datas no JavaScript</p>
        </header>

        <div class="card current-date">
            <h2>📅 Data e Hora Atual</h2>
            <div id="clock" class="clock">Carregando...</div>
        </div>

        <div class="card interaction">
            <h2>🛠️ Interação</h2>
            <p>Escolha uma data para analisar seus componentes:</p>
            <div class="input-group">
                <input type="datetime-local" id="dateInput">
                <button id="analyzeBtn">Analisar Data</button>
            </div>
        </div>

        <div id="analysisResult" class="card hidden">
            <h2>🔍 Resultados da Análise</h2>
            <div class="grid">
                <div class="grid-col">
                    <h3>Componentes</h3>
                    <div id="componentsList"></div>
                </div>
                <div class="grid-col">
                    <h3>Formatos</h3>
                    <div id="formatsList"></div>
                </div>
            </div>
        </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
